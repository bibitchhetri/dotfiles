# ==========================================
# 1. GENERAL SETTINGS
# ==========================================

# Default prefix key
set -g prefix C-b
unbind C-b
bind C-b send-prefix

# Index base starts from 1
set -g base-index 1
setw -g pane-base-index 1

# Automatic Renumbering of Windows
set -g renumber-windows on

# Enable mouse support (scrolling, pane resizing, pane selection)
set -g mouse on

# Allow image passthrough (imgcat, etc.)
set -g allow-passthrough on

# Act like vim (copy mode)
setw -g mode-keys vi

# ==========================================
# 2. KEYBINDINGS
# ==========================================

# New windows/splits open in current pane's directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Pane navigation (Vim style)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Tab navigation
bind C-n next-window
bind C-p previous-window

# Move window to a specific index, shifting others (prefix + .)
bind . command-prompt -T target { run-shell "~/.tmux/scripts/move-window.sh %%" }

# Resize panes using H, J, K, L (Shift + direction)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==========================================
# 3. PLUGINS (TPM)
# ==========================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Dracula Theme Settings ---
set -g @dracula-show-powerline true
set -g @dracula-fixed-location "Pokhara, NP"
set -g @dracula-plugins "weather"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g status-position top

# --- Persistence Settings ---
# Automatically save tmux environment every 5 minutes (default: 15)
set -g @continuum-save-interval '5'

# Automatically restore the last saved environment when tmux starts
set -g @continuum-restore 'on'

# Capture pane contents so they are restored exactly
set -g @resurrect-capture-pane-contents 'on'

# Restore common programs (nvim, vim, ssh, bash, zsh, htop, lazygit)
set -g @resurrect-processes 'nvim vim ssh bash zsh htop lazygit "git log" "git diff"'

# Save and restore neovim/vim sessions
set -g @resurrect-strategy-vim 'session'

# Initialize TMUX plugin manager (KEEP THIS AT THE VERY BOTTOM)
run '~/.tmux/plugins/tpm/tpm'

# ==========================================
# 4. POST-PLUGIN OVERRIDES
# ==========================================

