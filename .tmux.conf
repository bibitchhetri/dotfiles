set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*256col*:Tc"
setw -g aggressive-resize on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
bind c new-window -c "#{pane_current_path}"

set-option -g automatic-rename on
set-option -g automatic-rename-format "#{pane_current_command}"

set -g status-style "bg=default,fg=#ebdbb2"
set -g status-left-style "bg=default,fg=#ebdbb2"
set -g status-right-style "bg=default,fg=#ebdbb2"
setw -g window-status-style "bg=default,fg=#928374"
setw -g window-status-current-style "bg=default,fg=#458588,bold"
setw -g window-status-activity-style "bg=default,fg=#fe8019"
setw -g window-status-bell-style "bg=default,fg=#cc241d"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#458588"
set -g message-style "bg=default,fg=#458588"
set -g message-command-style "bg=default,fg=#458588"
setw -g mode-style "bg=default,fg=#458588,bold"
setw -g clock-mode-colour "#458588"

set -g status-position bottom
set -g status-interval 1
set -g status-left-length 20
set -g status-right-length 30
set -g status-left "#[fg=#458588] #S "
set -g status-right "#[fg=#ebdbb2] #I "
setw -g window-status-format " #I "
setw -g window-status-current-format " #I "
setw -g window-status-separator ""

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-bash-history 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @yank_action 'copy-pipe'
set -g @yank_selection 'primary'

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

run '~/.tmux/plugins/tpm/tpm'
